name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Create Web APK
        run: |
          nativefier --name "Chess 3D" "https://raw.githubusercontent.com/maryamkarimiiii1414-max/Chess_3d/main/chess-obsidian-gold.html" --platform android --out ./dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-3D-APK
          path: dist/**/*.apk
